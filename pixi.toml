[workspace]
authors = ["Mike Xiangyu Liu <liu.xiangyu@ucy.ac.cy>"]
channels = ["pytorch", "nvidia", "conda-forge"]
name = "VLAD-BuFF"
platforms = ["linux-64"]
version = "0.1.0"
channel-priority = "disabled"

[activation.env]
CUDA_VISIBLE_DEVICES = "0,1,2,3"

[tasks]
test = { cmd = "python -c \"import torch; print('torch:', torch.__version__); print('cuda available:', torch.cuda.is_available()); print(torch.cuda.mem_get_info())\"" }

[tasks.train-xfeat]
cmd = '''
python train.py
  --aggregation NETVLAD 
  --backbone xfeat 
  --expName xfeat_NV_192PCA_AB 
  --antiburst 
  --nv_pca 64 
  --no_wandb 
  --pl_seed False
  --batch_size 4
  --num_workers 8
'''
[dependencies]
python = "3.10.*"
pytorch = "2.1.0.*"
pytorch-cuda = "12.1.*"
torchvision = "0.16.0.*"
xformers = "*"
pip = "*"
faiss-gpu = "1.7.2.*"

[pypi-dependencies]
pandas = "==2.1.3"
prettytable = "==3.9.0"
pytorch-lightning = "==2.1.2"
pytorch-metric-learning = "==2.3.0"
torchmetrics = "==1.2.0"
wandb = "*"
opencv-python = "*"
natsort = "*"
matplotlib = "*"
scikit-image = "*"
seaborn = "*"
mpld3 = "*"
lightning = { version = "*", extras = ["extra"] }
triton = "*"

[system-requirements]
cuda = "12"
